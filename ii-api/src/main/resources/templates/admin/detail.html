<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이둘나라</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link th:href="@{/css/admin/home.css}" rel="stylesheet"/>
    <link th:href="@{/css/admin/navbar.css}" rel="stylesheet"/>
    <script>

        //화면 진입 구분
        function initializeView() {
            if ([[${ResBookDetail.emptyFlags}]]) {
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('detailView').style.display = 'none';
                document.getElementById('editForm').style.display = 'none';
            } else {
                document.getElementById('detailView').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('editForm').style.display = 'none';
            }
        }


        // 수정 - 이미지 미리보기
        function previewImage(event) {
            const image = document.getElementById('imagePreview');
            const fileInput = document.getElementById('imageUpload');

            // 선택한 파일이 있으면 미리보기 이미지 업데이트
            if (fileInput.files.length > 0) {
                image.src = URL.createObjectURL(fileInput.files[0]);
                image.style.display = 'block';
            } else {
                image.style.display = 'none'; // 파일이 없으면 미리보기 숨기기
            }
        }

        // 수정 - 새로 등록한 이미지가 있는지 확인
        function isFileChanged() {
            const fileInput = document.getElementById('imageUpload');
            return fileInput.files.length > 0; // 파일이 선택되었으면 true, 아니면 false
        }

        // 수정 - 이미지 변경되지 않은 경우는 null로 전송
        document.querySelector('form').onsubmit = function(event) {
            const fileInput = document.getElementById('imageUpload');

            // 파일이 선택되지 않았다면
            if (!isFileChanged()) {
                // 기존의 bookImgFile hidden input을 null로 설정
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'bookImgFile';
                hiddenInput.value = 'null'; // null로 설정
                this.appendChild(hiddenInput);
            } else {
                // 파일이 선택된 경우 기존의 bookImgFile hidden input이 있다면 제거
                const existingInput = this.querySelector('input[name="bookImgFile"]');
                if (existingInput) {
                    existingInput.remove(); // 기존의 input 제거
                }
            }
        };

        // 파일 입력의 onchange 이벤트에 미리보기 함수 연결
        document.getElementById('imageUpload').addEventListener('change', function(event) {
            const image = document.getElementById('imagePreview');
            const fileInput = document.getElementById('imageUpload');

            // 새 이미지가 등록되면 기존 이미지를 숨김
            if (fileInput.files.length > 0) {
                image.style.display = 'block'; // 미리보기 표시
            } else {
                image.style.display = 'none'; // 미리보기 숨김
            }

            // 미리보기 이미지 업데이트
            previewImage(event);
        });

        //등록 - 이미지 미리보기
        function previewNewImage(event) {
            const image = document.getElementById('newImagePreview');
            image.src = URL.createObjectURL(event.target.files[0]);
            image.style.display = 'block';
        }

        //상세 - 수정 버튼 클릭
        function editBook() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';

            // Enable the buttons in the table
            const buttons = document.querySelectorAll('.btn-outline-primary');
            buttons.forEach(button => {
                button.disabled = false; // Enable buttons
            });
        }

        //수정 - 취소 버튼 클릭
        function cancelEdit() {
            document.getElementById('detailView').style.display = 'block';
            document.getElementById('editForm').style.display = 'none';

            // Disable the buttons in the table
            const buttons = document.querySelectorAll('.btn-outline-primary');
            buttons.forEach(button => {
                button.disabled = true; // Disable buttons
            });
        }

        //등록 - 토글 버튼 클릭
        function registerToggleType(button, type1, type2, hiddenInputId) {
            const currentValue = parseInt(button.getAttribute('data-value'));
            let newValue;

            if (currentValue === 0) {
                newValue = -1;
                button.textContent = type1;
            } else if (currentValue === -1) {
                newValue = 1;
                button.textContent = type2;
            } else {
                newValue = 0;
                button.textContent = '해당없음';
            }

            button.setAttribute('data-value', newValue);
            document.getElementById(hiddenInputId).value = newValue;
        }

        //수정 - 토글 버튼 클릭
        function toggleType(button, type1, type2, typeKey) {
            const hiddenInput = document.getElementById(typeKey); // 해당 타입의 hidden input

            // Toggle button text and data-type attribute
            if (button.innerText.includes(type1)) {
                button.innerText = type2 === 'I' ? '내향형 (I)' : type2 === 'E' ? '외향형 (E)' :
                    type2 === 'S' ? '감각형 (S)' : type2 === 'N' ? '직관형 (N)' :
                        type2 === 'T' ? '사고형 (T)' : type2 === 'F' ? '감정형 (F)' :
                            type2 === 'P' ? '판단형 (P)' : '인식형 (J)';
                button.setAttribute('data-type', type2);
                button.setAttribute('data-value', type2 === 'I' || type2 === 'S' || type2 === 'T' || type2 === 'P' ? '-1' : '1');
            } else {
                button.innerText = type1 === 'I' ? '내향형 (I)' : type1 === 'E' ? '외향형 (E)' :
                    type1 === 'S' ? '감각형 (S)' : type1 === 'N' ? '직관형 (N)' :
                        type1 === 'T' ? '사고형 (T)' : type1 === 'F' ? '감정형 (F)' :
                            type1 === 'P' ? '판단형 (P)' : '인식형 (J)';
                button.setAttribute('data-type', type1);
                button.setAttribute('data-value', type1 === 'I' || type1 === 'S' || type1 === 'T' || type1 === 'P' ? '-1' : '1');
            }

            // Update the hidden input based on the button's new value
            hiddenInput.value = button.getAttribute('data-value');

            // Update the personality display
            updatePersonalityDisplay();
        }

        function updatePersonalityDisplay() {
            const typeIE = document.getElementById('typeIE').value; // I/E type hidden input
            const typeSN = document.getElementById('typeSN').value; // S/N type hidden input
            const typeTF = document.getElementById('typeTF').value; // T/F type hidden input
            const typePJ = document.getElementById('typePJ').value; // P/J type hidden input

            const personality =
                (typeIE == '-1' ? 'I' : (typeIE == '1' ? 'E' : '_')) +
                (typeSN == '-1' ? 'S' : (typeSN == '1' ? 'N' : '_')) +
                (typeTF == '-1' ? 'T' : (typeTF == '1' ? 'F' : '_')) +
                (typePJ == '-1' ? 'P' : (typePJ == '1' ? 'J' : '_'));

            document.getElementById('bookPersonalityEdit').innerText = personality;
        }

        function confirmDelete(bookId) {
            if (confirm("도서를 삭제하시겠습니까?")) {
                window.location.href = '/mbtkids/admin/delete?bookId=' + bookId;
            }
        }
    </script>
</head>
<body>
<!-- (상단 레이아웃) 네비게이션 바 -->
<th:block th:replace="~{navbar :: navbar}"></th:block>

<!-- 본문 내용 -->
<div class="container mt-5">

    <!-- 도서 상세 조회인 경우 View -->
    <div id="detailView" >
        <h2>도서 상세 정보</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${ResBookDetail.bookName}">도서명</h5>
                <img th:src="${ResBookDetail.bookImgUrl}" alt="도서 이미지" class="card-img-top" style="width: 200px; height: auto;"/>
                <p class="card-text">
                    <strong>작가명:</strong> <span th:text="${ResBookDetail.writer}"></span><br>
                    <strong>출판사:</strong> <span th:text="${ResBookDetail.publisher}"></span><br>
                    <strong>줄거리:</strong> <span th:text="${ResBookDetail.plot}"></span><br>
                    <strong>권장연령:</strong> <span th:text="${ResBookDetail.recommenedAge}"></span><br>
                    <strong>좋아요 개수:</strong> <span th:text="${ResBookDetail.likeCnt}"></span><br>
                    <strong>싫어요 개수:</strong> <span th:text="${ResBookDetail.disLikeCnt}"></span><br>
                    <strong>등록일자:</strong> <span th:text="${#dates.format(ResBookDetail.createdAt, 'yyyy-MM-dd')}"></span><br>
                    <strong>등록자:</strong> <span th:text="${ResBookDetail.createId}"></span><br>
                    <strong>수정일자:</strong> <span th:text="${#dates.format(ResBookDetail.updateAt, 'yyyy-MM-dd')}"></span><br>
                    <strong>수정자:</strong> <span th:text="${ResBookDetail.updateId}"></span><br>
                    <strong>노출 여부:</strong> <span th:text="${ResBookDetail.displayYn}"></span><br>
                    <strong>도서 성향:</strong> <span id="bookPersonality" th:text="(${ResBookDetail.typeIE == -1} ? 'I' : (${ResBookDetail.typeIE == 1} ? 'E' : '_')) + (${ResBookDetail.typeSN == -1} ? 'S' : (${ResBookDetail.typeSN == 1} ? 'N' : '_')) + (${ResBookDetail.typeTF == -1} ? 'T' : (${ResBookDetail.typeTF == 1} ? 'F' : '_')) + (${ResBookDetail.typePJ == -1} ? 'P' : (${ResBookDetail.typePJ == 1} ? 'J' : '_'))"></span>
                    <br>
                <table class="table mt-3">
                    <thead>
                    <tr>
                        <th scope="col">I/E</th>
                        <th scope="col">S/N</th>
                        <th scope="col">T/F</th>
                        <th scope="col">P/J</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>
                            <button type="button" class="btn btn-outline-primary" disabled
                                    data-type="I"
                                    onclick="toggleType(this, 'I', 'E')"
                                    th:text="${ResBookDetail.typeIE == -1} ? '내향형 (I)' : (${ResBookDetail.typeIE == 1} ? '외향형 (E)' : '_')"></button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-outline-primary" disabled
                                    data-type="S"
                                    onclick="toggleType(this, 'S', 'N')"
                                    th:text="${ResBookDetail.typeSN == -1} ? '감각형 (S)' : (${ResBookDetail.typeSN == 1} ? '직관형 (N)' : '_')"></button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-outline-primary" disabled
                                    data-type="T"
                                    onclick="toggleType(this, 'T', 'F')"
                                    th:text="${ResBookDetail.typeTF == -1} ? '사고형 (T)' : (${ResBookDetail.typeTF == 1} ? '감정형 (F)' : '_')"></button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-outline-primary" disabled
                                    data-type="P"
                                    onclick="toggleType(this, 'P', 'J')"
                                    th:text="${ResBookDetail.typePJ == -1} ? '판단형 (P)' : (${ResBookDetail.typePJ == 1} ? '인식형 (J)' : '_')"></button>
                        </td>
                    </tr>
                    </tbody>
                </table>
                </p>
                <a th:href="@{/mbtkids/admin/home}" class="btn btn-secondary">목록으로 돌아가기</a>
                <button class="btn btn-warning" onclick="editBook()">수정</button>
                <a th:href="@{/mbtkids/admin/delete(bookId=${ResBookDetail.bookId})}">삭제</a>
                <!-- <a href="#" onclick="confirmDelete(${ResBookDetail.bookId})">삭제</a> -->
                <a th:href="@{/mbtkids/admin/aiAnalysis(bookId=${ResBookDetail.bookId})}" class="btn btn-info">AI 성향 분석</a>
            </div>
        </div>
    </div>

    <!-- 도서 수정인 경우 View -->
    <div id="editForm" style="display: none;">
        <h2>도서 수정</h2>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/mbtkids/admin/update}" method="post" enctype="multipart/form-data">
                    <!-- 그대로 넘기는 값 -->
                    <input type="hidden" name="bookId" th:value="${ResBookDetail.bookId}" />
                    <input type="hidden" name="bookImgUrl" th:value="${ResBookDetail.bookImgUrl}" />

                    <img th:src="${ResBookDetail.bookImgUrl}" alt="도서 이미지" class="card-img-top" style="width: 200px; height: auto;"/>

                    <div class="form-group">
                        <label for="imageUpload">도서 이미지 업로드:</label>
                        <input type="file" id="imageUpload" name="bookImgFile" class="form-control" onchange="previewImage(event)">
                        <img id="imagePreview" alt="이미지 미리보기" style="display:none; width: 200px; height: auto; margin-top: 10px;"/>
                    </div>

                    <div class="form-group">
                        <label for="bookName">도서명:</label>
                        <input type="text" id="bookName" name="bookName" class="form-control"
                               th:value="${ResBookDetail.bookName}" required>
                    </div>

                    <div class="form-group">
                        <label for="writer">작가명:</label>
                        <input type="text" id="writer" name="writer" class="form-control"
                               th:value="${ResBookDetail.writer}" required>
                    </div>

                    <div class="form-group">
                        <label for="publisher">출판사:</label>
                        <input type="text" id="publisher" name="publisher" class="form-control"
                               th:value="${ResBookDetail.publisher}" required>
                    </div>

                    <div class="form-group">
                        <label for="plot">줄거리:</label>
                        <textarea id="plot" name="plot" class="form-control" required
                                  th:text="${ResBookDetail.plot}"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="recommenedAge">권장연령:</label>
                        <input type="text" id="recommenedAge" name="recommenedAge" class="form-control"
                               th:value="${ResBookDetail.recommenedAge}" required>
                    </div>

                    <div class="form-group">
                        <label for="displayYn">노출여부:</label>
                        <select id="displayYn" name="displayYn" class="form-control" required>
                            <option th:value="'Y'" th:text="'노출'" th:selected="${ResBookDetail.displayYn == 'Y'}"></option>
                            <option th:value="'N'" th:text="'비노출'" th:selected="${ResBookDetail.displayYn == 'N'}"></option>
                        </select>
                    </div>

                    <strong>도서 성향:</strong>
                    <span id="bookPersonalityEdit"
                          th:text="(${ResBookDetail.typeIE == -1} ? 'I' : (${ResBookDetail.typeIE == 1} ? 'E' : '해당없음')) + ' ' +
                (${ResBookDetail.typeSN == -1} ? 'S' : (${ResBookDetail.typeSN == 1} ? 'N' : '해당없음')) + ' ' +
                (${ResBookDetail.typeTF == -1} ? 'T' : (${ResBookDetail.typeTF == 1} ? 'F' : '해당없음')) + ' ' +
                (${ResBookDetail.typePJ == -1} ? 'P' : (${ResBookDetail.typePJ == 1} ? 'J' : '해당없음'))"></span>
                    <!--
                    <input type="hidden" id="typeIE" name="typeIE" value="${ResBookDetail.typeIE}" />
                    <input type="hidden" id="typeSN" name="typeSN" value="${ResBookDetail.typeSN}" />
                    <input type="hidden" id="typeTF" name="typeTF" value="${ResBookDetail.typeTF}" />
                    <input type="hidden" id="typePJ" name="typePJ" value="${ResBookDetail.typePJ}" />
                    -->
                    <input type="hidden" id="typeIE" name="typeIE" th:value="${ResBookDetail.typeIE}" />
                    <input type="hidden" id="typeSN" name="typeSN" th:value="${ResBookDetail.typeSN}" />
                    <input type="hidden" id="typeTF" name="typeTF" th:value="${ResBookDetail.typeTF}" />
                    <input type="hidden" id="typePJ" name="typePJ" th:value="${ResBookDetail.typePJ}" />

                    <table class="table mt-3">
                        <thead>
                        <tr>
                            <th scope="col">I/E</th>
                            <th scope="col">S/N</th>
                            <th scope="col">T/F</th>
                            <th scope="col">P/J</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="I" data-value="-1"
                                        onclick="toggleType(this, 'I', 'E', 'typeIE')"
                                        th:text="${ResBookDetail.typeIE == -1} ? '내향형 (I)' : (${ResBookDetail.typeIE == 1} ? '외향형 (E)' : '해당없음')"></button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="S" data-value="-1"
                                        onclick="toggleType(this, 'S', 'N', 'typeSN')"
                                        th:text="${ResBookDetail.typeSN == -1} ? '감각형 (S)' : (${ResBookDetail.typeSN == 1} ? '직관형 (N)' : '해당없음')"></button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="T" data-value="-1"
                                        onclick="toggleType(this, 'T', 'F', 'typeTF')"
                                        th:text="${ResBookDetail.typeTF == -1} ? '사고형 (T)' : (${ResBookDetail.typeTF == 1} ? '감정형 (F)' : '해당없음')"></button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="P" data-value="-1"
                                        onclick="toggleType(this, 'P', 'J', 'typePJ')"
                                        th:text="${ResBookDetail.typePJ == -1} ? '판단형 (P)' : (${ResBookDetail.typePJ == 1} ? '인식형 (J)' : '해당없음')"></button>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <button type="submit" class="btn btn-success">저장</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()">취소</button>

                </form>
            </div>
        </div>
    </div>

    <!-- 도서 등록인 경우 View -->
    <div id="registerForm" style="display: none;">
        <h2>도서 등록</h2>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/mbtkids/admin/register}" method="post" enctype="multipart/form-data">
                    <!-- 그대로 넘기는 값
                    <input type="hidden" name="bookId" th:value="${ResBookDetail.bookId}" /> -->
                    <input type="hidden" name="bookImgUrl" th:value="${ResBookDetail.bookImgUrl}" />

                    <div class="form-group">
                        <label for="newImageUpload">도서 이미지 업로드:</label>
                        <input type="file" id="newImageUpload" name="bookImgFile" class="form-control" onchange="previewNewImage(event)" required>
                        <img id="newImagePreview" alt="이미지 미리보기" style="display:none; width: 200px; height: auto; margin-top: 10px;"/>
                    </div>

                    <div class="form-group">
                        <label for="newBookName">도서명:</label>
                        <input type="text" id="newBookName" name="bookName" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="newWriter">작가명:</label>
                        <input type="text" id="newWriter" name="writer" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="newPublisher">출판사:</label>
                        <input type="text" id="newPublisher" name="publisher" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="newPlot">줄거리:</label>
                        <textarea id="newPlot" name="plot" class="form-control" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="newRecommenedAge">권장연령:</label>
                        <input type="text" id="newRecommenedAge" name="recommenedAge" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="newDisplayYn">노출여부:</label>
                        <select id="newDisplayYn" name="displayYn" class="form-control" required>
                            <option th:value="'Y'" th:text="'노출'"></option>
                            <option th:value="'N'" th:text="'비노출'"></option>
                        </select>
                    </div>

                    <strong>도서 성향:</strong> <span id="newBookPersonalityEdit">해당없음</span>
                    <input type="hidden" id="newTypeIE" name="typeIE" value="0" />
                    <input type="hidden" id="newTypeSN" name="typeSN" value="0" />
                    <input type="hidden" id="newTypeTF" name="typeTF" value="0" />
                    <input type="hidden" id="newTypePJ" name="typePJ" value="0" />

                    <table class="table mt-3">
                        <thead>
                        <tr>
                            <th scope="col">I/E</th>
                            <th scope="col">S/N</th>
                            <th scope="col">T/F</th>
                            <th scope="col">P/J</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="I" data-value="0"
                                        onclick="registerToggleType(this, 'I', 'E', 'newTypeIE')">해당없음</button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="S" data-value="0"
                                        onclick="registerToggleType(this, 'S', 'N', 'newTypeSN')">해당없음</button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="T" data-value="0"
                                        onclick="registerToggleType(this, 'T', 'F', 'newTypeTF')">해당없음</button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-primary"
                                        data-type="P" data-value="0"
                                        onclick="registerToggleType(this, 'P', 'J', 'newTypePJ')">해당없음</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <button type="submit" class="btn btn-success">저장</button>
                    <a th:href="@{/mbtkids/admin/home}" class="btn btn-secondary">취소</a>

                </form>
            </div>
        </div>
    </div>


</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script th:src="@{/js/home.js}"></script>

</body>

<script>
    window.onload = function()
    {
        initializeView();
    };
</script>


</html>
