<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이둘나라 관리자</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" th:href="@{/css/admin/AdminHome.css}">
</head>
<body>
<!-- 네비게이션 바 -->
<nav class="navbar admin-navbar navbar-expand-lg">
  <a class="navbar-brand" href="/mbtkids/admin/home">
    <i class='bx bxs-book-reader'></i>
    아이둘나라 관리자
  </a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
    <i class='bx bx-menu' style="color: white;"></i>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link" href="/mbtkids/admin/logout">
          <i class='bx bx-log-out'></i> 로그아웃
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="container">
  <!-- 검색 폼 -->
  <div class="search-form">
    <form action="#" th:action="@{/mbtkids/admin/home}" method="get">
      <div class="input-group">
        <input type="text"
               name="searchWord"
               class="form-control"
               placeholder="도서명, 작가명, 출판사로 검색">
        <div class="input-group-append">
          <button class="search-btn" type="submit">
            <i class='bx bx-search'></i> 검색
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- 관리자 컨테이너 -->
  <div class="admin-container">
    <!-- 상단 액션 버튼들 -->
    <div class="admin-header">
      <h2 class="admin-title">
        <i class='bx bxs-book'></i> 도서 관리
      </h2>
      <div class="action-buttons">
        <button class="stats-btn" onclick="toggleInputs()">
          <i class='bx bx-stats'></i> 통계 조회
        </button>
        <a th:href="@{/mbtkids/admin/detail(bookId=-1)}" class="add-book-btn">
          <i class='bx bx-plus'></i> 도서 등록
        </a>
      </div>
    </div>

    <!-- 통계 조회 폼 -->
    <div id="statsForm" class="stats-form" style="display: none;">
      <form action="#" th:action="@{/mbtkids/admin/stats}" method="get">
        <div class="stats-inputs">
          <div class="date-inputs">
            <div class="form-group">
              <label>시작일</label>
              <input type="date" name="startDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label>종료일</label>
              <input type="date" name="endDate" class="form-control" required>
            </div>
          </div>
          <div class="search-inputs">
            <div class="form-group">
              <label>출판사</label>
              <input type="text" name="publisher" class="form-control" placeholder="출판사명">
            </div>
            <div class="form-group">
              <label>도서명</label>
              <input type="text" name="bookName" class="form-control" placeholder="도서명">
            </div>
          </div>
          <button type="submit" class="stats-submit-btn">
            <i class='bx bx-search-alt'></i> 통계 조회
          </button>
        </div>
      </form>
    </div>

    <!-- 도서 목록 테이블 -->
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>도서명</th>
          <th>도서 이미지</th>
          <th>작가명</th>
          <th>출판사</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${ResBookList}">
          <td th:text="${book.bookId}"></td>
          <td>
            <a th:href="@{/mbtkids/admin/detail(bookId=${book.bookId})}"
               class="book-link"
               th:text="${book.bookName}"></a>
          </td>
          <td>
            <img th:src="${book.bookImgUrl}"
                 alt="책 이미지"
                 class="book-thumbnail"/>
          </td>
          <td th:text="${book.writer}"></td>
          <td th:text="${book.publisher}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
  function toggleInputs() {
    const form = document.getElementById('statsForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }
</script>
</body>
</html>
