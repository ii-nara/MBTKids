<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이둘나라 관리자</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" th:href="@{/css/admin/AdminHome.css}">
</head>
<body>
<!-- 네비게이션 바 -->
<nav class="navbar admin-navbar navbar-expand-lg">
  <a class="navbar-brand" href="/mbtkids/admin/home">
    <i class='bx bxs-book-reader'></i>
    아이둘나라 관리자
  </a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
    <i class='bx bx-menu' style="color: white;"></i>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link" href="/mbtkids/admin/logout">
          <i class='bx bx-log-out'></i> 로그아웃
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="container">
  <a class="nav-link" href="/mbtkids/admin/home">
    <i class='bx bx-arrow-back'></i> 목록으로 돌아가기
  </a>
  <!-- 검색 폼 -->
  <div class="search-form">
    <form action="#" th:action="@{/mbtkids/admin/stats}" method="get">
      <div class="input-group mb-3">
        <input type="date"
               name="startDate"
               class="form-control"
               required
               th:value="${param.startDate}"/>
        <input type="date"
               name="endDate"
               class="form-control"
               required
               th:value="${param.endDate}"/>
        <input type="text"
               name="publisher"
               class="form-control"
               placeholder="출판사명"
               th:value="${param.publisher}"/>
        <input type="text"
               name="bookName"
               class="form-control"
               placeholder="도서명"
               th:value="${param.bookName}"/>
        <div class="input-group-append">
          <button class="search-btn btn btn-primary" type="submit">
            <i class='bx bx-search'></i> 검색
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- 관리자 컨테이너 -->
  <div class="admin-container">

    <!-- 엑셀로 내보내기 버튼 -->
    <div class="mb-3">
      <form action="#" th:action="@{/mbtkids/admin/excel}" method="get">
        <input type="hidden" name="startDate" th:value="${param.startDate}"/>
        <input type="hidden" name="endDate" th:value="${param.endDate}"/>
        <input type="hidden" name="publisher" th:value="${param.publisher}"/>
        <input type="hidden" name="bookName" th:value="${param.bookName}"/>
        <button class="btn btn-success" type="submit">
          <i class='bx bx-file'></i> 엑셀로 내보내기
        </button>
      </form>
    </div>

    <!-- 도서 통계 목록 테이블 -->
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>도서명</th>
          <th>출판사</th>
          <th>좋아요 개수</th>
          <th>싫어요 개수</th>
          <th>평균 연령대</th>
          <th>평균 성향</th>
          <th>통계 출력 일자</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="stat : ${StatsList}">
          <td th:text="${stat.statsId}"></td>
          <td>
            <a th:href="@{/mbtkids/admin/detail(bookId=${stat.bookId})}"
               class="book-link"
               th:text="${stat.bookName}"></a>
          </td>
          <td th:text="${stat.publisher}"></td>
          <td th:text="${stat.likeCnt}"></td>
          <td th:text="${stat.disLikeCnt}"></td>
          <td th:text="${stat.avgAge}"></td>
          <td th:text="${stat.avgMbti}"></td>
          <td th:text="${stat.statsAt}"></td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
