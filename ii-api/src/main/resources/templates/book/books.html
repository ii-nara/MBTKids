<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이둘나라</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" th:href="@{/css/book/books.css}">
</head>
<body>
<th:block th:replace="navbar :: navbar"></th:block>

<div class="container">
  <h2>
    <i class='bx bxs-book-heart'></i>
    <span th:text="${title} + ' ('+ ${books.getCount()} + '권)'">도서 목록</span>
  </h2>

  <div class="books-grid">
    <!-- 각 책 카드를 링크로 감싸기 -->
    <a th:href="@{/mbtkids/book/detail(bookId=${book.bookId})}"
       class="book-link"
       th:each="book : ${books.getItems()}">
      <div class="book-card">
        <div class="book-image-container">
          <img th:src="${book.bookImgUrl}" alt="책 이미지" class="book-image"/>
        </div>
        <div class="book-info">
          <h3 class="book-title" th:text="${book.bookName}">도서명</h3>
          <p class="book-details">
            <i class='bx bxs-user'></i>
            <span th:text="${book.writer}">작가명</span>
          </p>
          <p class="book-details">
            <i class='bx bxs-buildings'></i>
            <span th:text="${book.publisher}">출판사</span>
          </p>
        </div>
      </div>
    </a>
  </div>

  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link"
           th:href="@{/mbtkids/books(type=${type}, page=${currentPage - 1}, size=${pageSize})}">
          <i class='bx bx-chevron-left'></i> 이전
        </a>
      </li>
      <li class="page-item"
          th:classappend="${!books.isNextPage(currentPage, pageSize)} ? 'disabled'">
        <a class="page-link"
           th:href="@{/mbtkids/books(type=${type}, page=${currentPage + 1}, size=${pageSize})}">
          다음 <i class='bx bx-chevron-right'></i>
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
