<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>아이둘나라</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link th:href="@{/css/home.css}" rel="stylesheet"/>
  <link th:href="@{/css/navbar.css}" rel="stylesheet"/>
  <style>
    /* 페이지 전체에 적용된 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding-top: 80px; /* 네비게이션 바 공간 확보 */
      background-color: #f4f4f9;
    }

    /* 폼 컨테이너 스타일 */
    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 0 auto;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    .form-group input:focus {
      border-color: #007bff;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
<!-- (상단 레이아웃) 네비게이션 바 -->
<th:block th:replace="navbar :: navbar"></th:block>

<!-- 응모완료 alert -->
<div class="container mt-3">
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <p th:text="${successMessage}"></p>
  </div>
</div>

<!-- 본문 내용 -->
<div class="container mt-5">

  <!-- @@ 여기에 본인 코드 내용 넣어주심 됩니다 -->
  <div class="container mt-5">
    <div class="form-container">
      <h2>이벤트 응모</h2>
      <form th:action="@{/mbtkids/events}" th:object="${eventSaveRequestDto}" method="post"
            onsubmit="return validateForm()">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요" required>
          <div class="error-message" id="nameError" style="color: red; display: none;"></div>
          <!-- 에러 메시지 추가 -->
        </div>
        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" th:field="*{phone}" placeholder="010-0000-0000" required>
          <div class="error-message" id="phoneError" style="color: red; display: none;"></div>
          <!-- 에러 메시지 추가 -->
        </div>
        <button type="submit" class="submit-btn">응모하기</button>
      </form>
    </div>
  </div>

</div>
<script>
  function validateForm() {
    // 폼 요소 가져오기
    const name = document.getElementById("name");
    const phone = document.getElementById("phone");
    const nameError = document.getElementById("nameError");
    const phoneError = document.getElementById("phoneError");

    let isValid = true;

    // 이름 유효성 검사
    if (name.value.trim() === "") {
      nameError.style.display = "block";
      nameError.innerText = "이름을 입력하세요.";
      isValid = false;
    } else {
      nameError.style.display = "none";
    }

    // 전화번호 유효성 검사
    const phonePattern = /^010-\d{4}-\d{4}$/;
    if (!phonePattern.test(phone.value)) {
      phoneError.style.display = "block";
      phoneError.innerText = "전화번호 형식이 올바르지 않습니다. 예) 010-0000-0000";
      isValid = false;
    } else {
      phoneError.style.display = "none";
    }

    return isValid; // 유효성 검사 결과 반환
  }
</script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script th:src="@{/js/home.js}"></script>
</body>
</html>
