<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이둘나라 - 이벤트</title>
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" th:href="@{/css/event/events.css}">
  <style>
    .submit-btn:disabled {
      background-color: #d3d3d3; /* Light gray color for disabled state */
      color: #777; /* Darker gray text for readability */
      cursor: not-allowed; /* Show not-allowed cursor */
    }
  </style>
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="event-container">
  <!-- 응모완료 알림 -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <p th:text="${errorMessage}"></p>
  </div>

  <!-- 이벤트 헤더 -->
  <div class="event-header">
    <h1 class="event-title">아이둘나라 런칭 기념 이벤트</h1>
    <p class="event-subtitle">우리 아이에게 딱 맞는 책을 찾아주세요!</p>
    <div class="event-period">
      <i class='bx bx-calendar'></i>
      2024.11.04 ~ 2024.11.04
    </div>
  </div>

  <!-- 이벤트 콘텐츠 -->
  <div class="event-content">
    <div class="event-description">
      <p>아이둘나라와 함께 시작하는 즐거운 독서 생활!</p>
      <p>이벤트에 참여하시는 모든 분들께 특별한 선물을 드립니다.</p>
    </div>

    <div class="event-benefits">
      <h3 class="benefits-title">
        <i class='bx bx-gift'></i>
        이벤트 혜택
      </h3>
      <ul class="benefits-list">
        <li>추첨을 통해 그림책 세트 증정 (100명)</li>
        <li>전원 1,000포인트 적립</li>
        <li>신규 가입자 특별 할인 쿠폰 지급</li>
      </ul>
    </div>
  </div>

  <!-- 응모 폼 -->
  <div class="application-form">
    <h2>이벤트 응모하기</h2>
    <form th:action="@{/mbtkids/events}" th:object="${eventSaveRequestDto}"
          method="post" onsubmit="return validateForm()">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" th:field="*{name}"
               placeholder="이름을 입력해주세요" required>
        <div class="error-message" id="nameError" style="display: none;"></div>
      </div>

      <div class="form-group">
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" th:field="*{phone}"
               placeholder="01012345678" required>
        <div class="error-message" id="phoneError" style="display: none;"></div>
      </div>

      <button type="submit" class="submit-btn"
              th:disabled="${exists} or ${!isEventTime}"
              th:text="${exists} ? '응모완료' : (${!isEventTime} ? '준비중' : '응모하기')">
        <i class='bx bx-party'></i>
        이벤트 응모하기
      </button>
    </form>
  </div>
</div>

<script th:inline="javascript">
  function validateForm() {
    const name = document.getElementById("name");
    const phone = document.getElementById("phone");
    const nameError = document.getElementById("nameError");
    const phoneError = document.getElementById("phoneError");

    const now = new Date();
    const eventStartTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 7, 0, 0);

    if (now < eventStartTime) {
      alert("이벤트는 오후 1시부터 시작됩니다.");
      return false;
    }

    let isValid = true;

    if (name.value.trim() === "") {
      nameError.style.display = "block";
      nameError.innerText = "이름을 입력해주세요.";
      isValid = false;
    } else {
      nameError.style.display = "none";
    }

    const phonePattern = /^010\d{4}\d{4}$/;
    if (!phonePattern.test(phone.value)) {
      phoneError.style.display = "block";
      phoneError.innerText = "전화번호 형식이 올바르지 않습니다. (-를 제외한 번호만 입력해주세요.)";
      isValid = false;
    } else {
      phoneError.style.display = "none";
    }

    return isValid;
  }

  function updateButtonState() {
    const now = new Date();
    const eventStartTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 7, 0, 0);
    const submitBtn = document.querySelector(".submit-btn");

    if (now < eventStartTime) {
      submitBtn.disabled = true;
      submitBtn.textContent = '준비중';
    }
  }

  updateButtonState();
  setInterval(updateButtonState, 60000);
</script>
</body>
</html>
