<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User add Info</title>
</head>
<body>
<h1>User add Info</h1>

<form action="/mbtkids/oauth/additionalInfo" method="POST">
  <label for="userName">이름:</label>
  <input type="text" id="userName" name="userName" required><br><br>

  <label for="phoneNumber">전화번호:</label>
  <input type="number" id="phoneNumber" name="phoneNumber" required><br><br>

  <label for="infoAgreeYn">Agree to Terms:</label>
  <input type="hidden" name="infoAgreeYn" value="false">
  <input type="checkbox" id="infoAgreeYn" name="infoAgreeYn" value="true">

  <button type="submit">저장</button>
</form>

<!-- 필요하면 자식 추가 취소 버튼도 추가 가능 -->
<a href="/mbtkids/childSelectOrAdd">
  <button type="button">취소</button>
</a>
</body>
</html>
