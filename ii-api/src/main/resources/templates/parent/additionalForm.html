<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이둘나라</title>
  <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="/css/parent/additionalForm.css">
</head>
<body>
<i class='bx bxs-star decoration decoration-1'></i>
<i class='bx bxs-heart decoration decoration-2'></i>

<div class="container">
  <h1 class="title">
    <i class='bx bxs-user-detail'></i>
    추가 정보 입력
  </h1>

  <p class="subtitle">
    더 나은 서비스 제공을 위해<br>
    몇 가지 정보가 더 필요해요!
  </p>

  <form action="/mbtkids/oauth/additionalInfo" method="POST">
    <div class="form-group">
      <label for="userName">이름</label>
      <input type="text"
             id="userName"
             name="userName"
             required
             placeholder="이름을 입력해주세요"
             autocomplete="name">
      <i class='bx bx-user'></i>
    </div>

    <div class="form-group">
      <label for="phoneNumber">전화번호</label>
      <input type="tel"
             id="phoneNumber"
             name="phoneNumber"
             required
             placeholder="휴대폰 번호를 입력해주세요"
             pattern="[0-9]{3}[0-9]{4}[0-9]{4}"
             title="전화번호는 숫자만 입력해주세요"
             autocomplete="tel">
      <i class='bx bx-phone'></i>
    </div>

    <div class="agreement-box">
      <div class="agreement-title">
        <i class='bx bx-check-shield'></i>
        약관 동의
      </div>
      <div class="checkbox-wrapper">
        <input type="hidden" name="infoAgreeYn" value="false">
        <input type="checkbox"
               id="infoAgreeYn"
               name="infoAgreeYn"
               value="true"
               class="custom-checkbox"
               required>
        <label for="infoAgreeYn">서비스 이용약관에 동의합니다</label>
      </div>
    </div>

    <button type="submit" class="submit-btn">
      <i class='bx bx-check'></i>
      정보 저장하기
    </button>
  </form>
</div>

<script>
  const phoneInput = document.getElementById('phoneNumber');
  phoneInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');

    if (e.target.value.length > 11) {
      e.target.value = e.target.value.slice(0, 11);
    }
  });

  const form = document.querySelector('form');
  const nameInput = document.getElementById('userName');
  const agreeCheckbox = document.getElementById('infoAgreeYn');

  form.addEventListener('submit', (e) => {
    if (nameInput.value.trim() === '') {
      e.preventDefault();
      alert('이름을 입력해주세요!');
      nameInput.focus();
      return;
    }

    if (phoneInput.value.length !== 11) {
      e.preventDefault();
      alert('올바른 전화번호를 입력해주세요!');
      phoneInput.focus();
      return;
    }

    if (!agreeCheckbox.checked) {
      e.preventDefault();
      alert('서비스 이용약관에 동의해주세요!');
      agreeCheckbox.focus();
      return;
    }
  });
</script>
</body>
</html>
